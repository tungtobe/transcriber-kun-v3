[package]
name = "trans-kun"
version = "0.1.0"
description = "trans-kun"
edition = "2021"
rust-version = "1.93"

# Version app một nguồn duy nhất: đây. `tauri.conf.json` không khai báo `version`
# nên Tauri lấy version từ package này lúc build.

[lib]
name = "trans_kun_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["specta", "protocol-asset"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tauri-plugin-opener = "=2.5.5"
# Story 1.10: dialog lưu file hệ thống cho "Xuất gói nhật ký" — mở chỉ từ
# Rust, không cấp capability cho frontend (spec Boundaries). Dùng thẳng `rfd`
# (crate nền bên dưới của plugin dialog chính thức, không phải bản thân
# plugin đó) thay vì plugin Tauri tương ứng: bản pin chính xác của plugin đó
# kéo theo một crate hỗ trợ thao tác file khác như một dependency bắt buộc,
# và tên crate đó khớp allow-list cấm của `scripts/check-forbidden-deps.mjs`.
# `rfd` không phải plugin Tauri (không đăng ký qua `.plugin(...)`, không nằm
# trong allow-list cấm), nên tránh được xung đột đó hoàn toàn trong khi vẫn
# giữ dialog mở chỉ phía Rust.
rfd = "=0.17.2"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = { version = "=0.0.12" }
serde = { version = "=1.0.229", features = ["derive"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rusqlite_migration = "=2.6.0"
tracing = "=0.1.44"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
uuid = { version = "=1.26.1", features = ["v7"] }
regex = "=1.13.1"
# Story 1.2: `settings/` (de)serialize value từng khoá dạng JSON để lưu vào
# cột TEXT của bảng `settings`; trước đó chỉ dùng trong spike test nên đủ ở
# dev-dependencies, giờ cần ở runtime nên chuyển hẳn lên đây (một nơi khai
# báo duy nhất, không lặp lại ở dev-dependencies).
serde_json = { version = "=1.0.151" }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
futures-util = "=0.3.34"
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
symphonia = { version = "=0.6.1", default-features = false, features = ["aac", "adpcm", "aiff", "alac", "caf", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }
rubato = "=5.0.0"
flacenc = "=0.5.1"
hound = "=3.5.1"
chrono = "=0.4.45"
sha2 = "=0.10.9"
base64 = "=0.22.1"
ed25519-dalek = "=2.2.0"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }

# Keyring is intentionally restricted to the two supported desktop stores.
# Linux is not a supported product target; keeping this dependency target
# specific also means a Linux development build cannot silently select a
# Secret Service backend or write credentials outside the OS stores we ship.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
cpal = { version = "=0.18.2" }
keyring = { version = "=4.2.0", default-features = true }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "=0.24.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-core-audio = "=0.3.2"
objc2-core-foundation = "=0.3.2"
objc2-foundation = "=0.3.2"

[dev-dependencies]
tempfile = "=3.27.0"
