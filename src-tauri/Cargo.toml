[package]
name = "trans-kun"
version = "0.1.0"
description = "trans-kun"
edition = "2021"
rust-version = "1.93"

# Version app một nguồn duy nhất: đây. `tauri.conf.json` không khai báo `version`
# nên Tauri lấy version từ package này lúc build.

[lib]
name = "trans_kun_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["specta"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = { version = "=0.0.12" }
serde = { version = "=1.0.229", features = ["derive"] }

[dev-dependencies]
# Chỉ dùng trong spike (#[cfg(test)] ipc/spike_channel.rs) để giải mã
# InvokeResponseBody::Json khi kiểm Channel<T> runtime — không phải dependency
# production.
serde_json = { version = "=1.0.151" }
