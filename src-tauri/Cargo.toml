[package]
name = "trans-kun"
version = "0.1.0"
description = "trans-kun"
edition = "2021"
rust-version = "1.93"

# Version app một nguồn duy nhất: đây. `tauri.conf.json` không khai báo `version`
# nên Tauri lấy version từ package này lúc build.

[lib]
name = "trans_kun_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["specta"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = { version = "=0.0.12" }
serde = { version = "=1.0.229", features = ["derive"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rusqlite_migration = "=2.6.0"
tracing = "=0.1.44"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
uuid = { version = "=1.26.1", features = ["v7"] }
regex = "=1.13.1"
# Story 1.2: `settings/` (de)serialize value từng khoá dạng JSON để lưu vào
# cột TEXT của bảng `settings`; trước đó chỉ dùng trong spike test nên đủ ở
# dev-dependencies, giờ cần ở runtime nên chuyển hẳn lên đây (một nơi khai
# báo duy nhất, không lặp lại ở dev-dependencies).
serde_json = { version = "=1.0.151" }

[dev-dependencies]
tempfile = "=3.27.0"
